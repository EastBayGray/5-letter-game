<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Five-Letter Word Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FCF3B8;
    --rule: #9DB8D9;
    --margin: #E07A7A;
    --ink: #1E3A8A;
    --ink-soft: #4B64A8;
    --red: #C2302A;
    --pencil: #6B6A5E;
    --line: 34px;
    --hand: 'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', cursive;
    --print: 'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', cursive;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B2233; --rule: #2E3B57; --margin: #7A3A44;
      --ink: #E8E2C4; --ink-soft: #B9B39A; --red: #FF7A6E; --pencil: #8D8C80;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B2233; --rule: #2E3B57; --margin: #7A3A44;
    --ink: #E8E2C4; --ink-soft: #B9B39A; --red: #FF7A6E; --pencil: #8D8C80;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--print);
    font-size: 20px;
    line-height: var(--line);
    min-height: 100vh;
  }
  .sheet {
    position: relative;
    max-width: 620px;
    margin: 0 auto;
    padding: calc(var(--line) * 1) 18px calc(var(--line) * 2) 64px;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px), var(--rule) var(--line));
    background-position: 0 calc(var(--line) * 2.5);
    background-repeat: no-repeat;
    background-size: 100% 100%;
    min-height: 100vh;
  }
  .sheet::before, .sheet::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--margin);
  }
  .sheet::before { left: 46px; }
  .sheet::after { left: 50px; }

  h1 {
    font-family: var(--hand);
    font-weight: 400;
    font-size: clamp(2.3rem, 9vw, 3.3rem);
    line-height: 1;
    margin: 0 0 6px;
  }
  .underline { display: block; width: 92%; height: 14px; margin: 0 0 calc(var(--line) - 6px); }
  .underline path { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }

  h2 {
    font-family: var(--hand);
    font-weight: 400;
    font-size: 1.75rem;
    line-height: var(--line);
    margin: var(--line) 0 0;
  }
  .hint { color: var(--pencil); font-size: 1rem; margin: 0; }

  /* Hand-drawn marks shared by alphabet keys and guess letters */
  .mark { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; overflow: visible; }
  .mark path { fill: none; stroke-width: 2.6; stroke-linecap: round; }
  .out .strike { opacity: 1; }
  .out .strike path { stroke: var(--red); }
  .in .ring { opacity: 1; }
  .in .ring path { stroke: var(--ink); }

  /* Alphabet */
  .alphabet { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px 2px; margin-top: 8px; }
  @media (max-width: 420px) { .alphabet { grid-template-columns: repeat(7, 1fr); } }
  .key {
    position: relative;
    font-family: var(--print);
    font-size: 1.6rem;
    color: var(--ink);
    background: none; border: 0; padding: 0;
    height: 46px;
    cursor: pointer;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    border-radius: 50%;
  }
  .key:focus-visible { outline: 2px dashed var(--ink-soft); outline-offset: 2px; }
  .key.out { color: var(--pencil); }

  /* Circle zone */
  .zone { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-top: 10px; }
  .circle {
    position: relative; aspect-ratio: 2.1 / 1; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap;
    padding: 12% 12%;
  }
  .circle > svg.loop { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .circle > svg.loop path { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
  .circle.over > svg.loop path { stroke: var(--red); stroke-width: 3.2; }
  .empty { color: var(--pencil); font-size: 1rem; text-align: center; line-height: 1.3; }
  .found {
    font-family: var(--hand); font-weight: 400; font-size: 2.6rem; line-height: 1;
    background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0 4px;
    transition: transform .35s ease;
  }
  .found:nth-child(odd) { transform: rotate(-4deg); }
  .found:nth-child(even) { transform: rotate(3deg) translateY(3px); }
  .side { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .pen-btn {
    font-family: var(--hand); font-weight: 400; font-size: 1.35rem; color: var(--ink);
    background: none; cursor: pointer; padding: 4px 12px;
    border: 2px solid var(--ink); border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
  }
  .pen-btn:active { transform: translateY(1px); }
  .pen-btn:focus-visible, .found:focus-visible { outline: 2px dashed var(--ink-soft); outline-offset: 3px; }
  .bin { width: 54px; height: 60px; display: grid; place-items: center; border-radius: 8px; background: none; border: 0; padding: 0; cursor: pointer; }
  .bin:focus-visible { outline: 2px dashed var(--ink-soft); outline-offset: 3px; }
  .bin:active { transform: translateY(1px); }
  .bin svg { width: 44px; height: 52px; }
  .bin svg path { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .bin.over svg path { stroke: var(--red); }
  .bin-label { font-size: .9rem; color: var(--pencil); line-height: 1; margin-top: -6px; }

  /* My word */
  .myword { display: flex; gap: 12px; margin-top: 6px; }
  .slot {
    width: 44px; height: var(--line);
    font-family: var(--hand); font-weight: 400; font-size: 2.2rem; text-align: center;
    color: var(--ink); background: none; border: 0; border-bottom: 3px solid var(--ink);
    border-radius: 0; padding: 0; text-transform: uppercase; caret-color: var(--red);
  }
  .slot:focus { outline: none; border-bottom-color: var(--red); }

  /* Guess lists */
  .lines { list-style: none; margin: 0; padding: 0; }
  .lines li { display: flex; align-items: center; gap: 14px; height: var(--line); }
  .lines .n { width: 22px; color: var(--pencil); font-size: 1rem; text-align: right; flex: none; }
  .cells { display: flex; gap: 2px; flex: none; }
  .cell { position: relative; width: 32px; height: var(--line); }
  .cell input {
    width: 100%; height: 100%;
    font-family: var(--hand); font-weight: 400; font-size: 1.9rem; text-align: center;
    color: var(--ink); background: none; border: 0; border-bottom: 2px solid var(--rule);
    border-radius: 0; padding: 0; text-transform: uppercase; caret-color: var(--red);
  }
  .cell input:focus { outline: none; border-bottom-color: var(--red); }
  .cell.out input { color: var(--pencil); }
  .cell.hit input { color: var(--red); }
  .cell .mark { inset: 2px 1px 4px 1px; width: auto; height: auto; }
  .score {
    width: 34px; height: 30px; flex: none; font-family: var(--hand); font-weight: 400; font-size: 1.7rem; text-align: center;
    line-height: 26px; color: var(--red); background: none; padding: 0; caret-color: var(--red);
    border: 2px solid var(--ink-soft); border-radius: 50% 45% 55% 48%;
  }
  input.score:focus { outline: none; border-color: var(--red); }
  .score.auto { border-style: dashed; }
  .colhead { display: flex; gap: 14px; color: var(--pencil); font-size: 1rem; }
  .colhead span:first-child { width: 22px; }
  .colhead span:nth-child(2) { width: 168px; }
  .add { margin-top: 8px; }

  footer { margin-top: calc(var(--line) * 2); display: flex; gap: 14px; flex-wrap: wrap; }

  .ghost {
    position: fixed; z-index: 10; pointer-events: none;
    font-family: var(--hand); font-weight: 400; font-size: 2.6rem; color: var(--red);
    transform: translate(-50%, -60%) rotate(-6deg);
  }
  @media (prefers-reduced-motion: reduce) { .found { transition: none; } }
</style>
</head>
<body>
<main class="sheet">
  <h1>The Five-Letter Word Game</h1>
  <svg class="underline" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true"><path d="M2 9 C 60 4, 120 12, 180 7 S 260 5, 298 8"/></svg>

  <p class="hint">Tap a letter once to cross it off, twice to put it in the circle. Or drag it to the circle or the bin.</p>
  <div class="alphabet" id="alphabet" role="group" aria-label="Alphabet"></div>

  <h2>Letters in their word</h2>
  <div class="zone">
    <div class="circle" id="circle" data-drop="in">
      <svg class="loop" viewBox="0 0 210 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M108 6 C 160 4, 205 22, 203 50 C 201 82, 150 96, 100 95 C 46 94, 6 78, 7 49 C 8 20, 52 6, 112 9"/>
      </svg>
    </div>
    <div class="side">
      <button class="pen-btn" id="scramble" type="button">Scramble</button>
      <button type="button" class="bin" id="bin" data-drop="out" aria-label="Empty the circle">
        <svg viewBox="0 0 44 52" aria-hidden="true"><path d="M6 12 H38 M17 12 V7 H27 V12 M9 12 L12 48 H32 L35 12 M17 19 L18 41 M22 19 V41 M27 19 L26 41"/></svg>
      </button>
      <span class="bin-label">bin</span>
    </div>
  </div>

  <h2>My word</h2>
  <div class="myword" id="myword"></div>

  <h2>My guesses</h2>
  <div class="colhead"><span></span><span>word</span><span>how many</span></div>
  <ol class="lines" id="mine"></ol>
  <button class="pen-btn add" type="button" data-add="mine">Add a line</button>

  <h2>The words they've asked me</h2>
  <p class="hint">The number fills itself in from my word.</p>
  <div class="colhead"><span></span><span>word</span><span>I say</span></div>
  <ol class="lines" id="theirs"></ol>
  <button class="pen-btn add" type="button" data-add="theirs">Add a line</button>

  <footer>
    <button class="pen-btn" id="reset" type="button">Start a new game</button>
  </footer>
</main>

<script>
(function () {
  var KEY = 'five-letter-word-game-v1';
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  var START_ROWS = 8;

  function blank() {
    return { marks: {}, order: [], myword: ['', '', '', '', ''],
      mine: Array.from({ length: START_ROWS }, function () { return { w: '', n: '' }; }),
      theirs: Array.from({ length: START_ROWS }, function () { return { w: '', n: '' }; }) };
  }
  var state = blank();
  try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved && saved.mine) state = saved; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var strike = '<svg class="mark strike" viewBox="0 0 40 46" preserveAspectRatio="none" aria-hidden="true"><path d="M7 37 L33 9"/><path d="M9 33 L31 11"/></svg>';
  var ring = '<svg class="mark ring" viewBox="0 0 40 46" preserveAspectRatio="none" aria-hidden="true"><path d="M22 5 C 34 5, 38 17, 37 25 C 36 37, 27 42, 19 41 C 9 40, 3 32, 4 22 C 5 12, 12 5, 25 7"/></svg>';

  var alphabet = document.getElementById('alphabet');
  var circle = document.getElementById('circle');
  var bin = document.getElementById('bin');

  // How many letters two words share (each letter in my word can only be matched once).
  function common(a, b) {
    if (a.length !== 5 || b.length !== 5) return '';
    var counts = {};
    b.split('').forEach(function (c) { counts[c] = (counts[c] || 0) + 1; });
    var n = 0;
    a.split('').forEach(function (c) { if (counts[c] > 0) { n++; counts[c]--; } });
    return String(n);
  }

  // Which letters of a word match my word (again, each letter of my word matches once).
  function hits(w, mine) {
    var counts = {}, res = [];
    mine.split('').forEach(function (c) { if (c) counts[c] = (counts[c] || 0) + 1; });
    for (var i = 0; i < 5; i++) {
      var c = w.charAt(i);
      res.push(!!c && counts[c] > 0);
      if (res[i]) counts[c]--;
    }
    return res;
  }
  function paintTheirs(li, row) {
    var h = hits(row.w, state.myword.join(''));
    li.querySelectorAll('.cell').forEach(function (cell, i) { cell.classList.toggle('hit', h[i]); });
  }

  function setMark(letter, mark) {
    var prev = state.marks[letter] || '';
    if (mark) state.marks[letter] = mark; else delete state.marks[letter];
    if (mark === 'in' && prev !== 'in') state.order.push(letter);
    if (mark !== 'in') state.order = state.order.filter(function (l) { return l !== letter; });
    save(); renderMarks();
  }

  function renderAlphabet() {
    alphabet.innerHTML = '';
    LETTERS.forEach(function (l) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'key'; b.dataset.letter = l;
      b.innerHTML = '<span>' + l + '</span>' + strike + ring;
      attachDrag(b);
      alphabet.appendChild(b);
    });
  }

  function paintCell(cell) {
    var l = cell.querySelector('input').value;
    var m = l ? (state.marks[l] || '') : '';
    cell.classList.toggle('out', m === 'out');
    cell.classList.toggle('in', m === 'in');
  }
  function paintGuesses() {
    document.querySelectorAll('#mine .cell').forEach(paintCell);
  }

  function renderMarks() {
    alphabet.querySelectorAll('.key').forEach(function (b) {
      var m = state.marks[b.dataset.letter] || '';
      b.classList.toggle('out', m === 'out');
      b.classList.toggle('in', m === 'in');
      b.setAttribute('aria-label', b.dataset.letter + (m === 'out' ? ', crossed off' : m === 'in' ? ', in their word' : ''));
    });
    circle.querySelectorAll('.found, .empty').forEach(function (n) { n.remove(); });
    if (!state.order.length) {
      var e = document.createElement('p'); e.className = 'empty';
      e.textContent = 'Letters you know are in their word go here';
      circle.appendChild(e);
    }
    state.order.forEach(function (l) {
      var f = document.createElement('button');
      f.type = 'button'; f.className = 'found'; f.textContent = l;
      f.setAttribute('aria-label', 'Take ' + l + ' out of the circle');
      f.addEventListener('click', function () { setMark(l, ''); });
      circle.appendChild(f);
    });
    paintGuesses();
  }

  // Tap cycles: plain -> crossed off -> in circle -> plain. Drag drops onto circle or bin.
  function attachDrag(btn) {
    var start = null, ghost = null, dragged = false, target = null;
    btn.addEventListener('pointerdown', function (ev) {
      start = { x: ev.clientX, y: ev.clientY }; dragged = false;
      btn.setPointerCapture(ev.pointerId);
    });
    btn.addEventListener('pointermove', function (ev) {
      if (!start) return;
      if (!dragged && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) > 8) {
        dragged = true;
        ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.textContent = btn.dataset.letter;
        document.body.appendChild(ghost);
      }
      if (dragged) {
        ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
        var el = document.elementFromPoint(ev.clientX, ev.clientY);
        var drop = el && el.closest('[data-drop]');
        if (target && target !== drop) target.classList.remove('over');
        target = drop; if (target) target.classList.add('over');
      }
    });
    function end() {
      if (dragged) {
        if (target) { setMark(btn.dataset.letter, target.dataset.drop); target.classList.remove('over'); }
        if (ghost) ghost.remove();
        btn.dataset.skipClick = '1';
      }
      start = null; ghost = null; target = null;
    }
    btn.addEventListener('pointerup', end);
    btn.addEventListener('pointercancel', end);
    btn.addEventListener('click', function () {
      if (btn.dataset.skipClick) { delete btn.dataset.skipClick; return; }
      var m = state.marks[btn.dataset.letter] || '';
      setMark(btn.dataset.letter, m === '' ? 'out' : m === 'out' ? 'in' : '');
    });
  }

  bin.addEventListener('click', function () {
    state.order.forEach(function (l) { delete state.marks[l]; });
    state.order = []; save(); renderMarks();
  });

  document.getElementById('scramble').addEventListener('click', function () {
    var a = state.order.slice();
    if (a.length < 2) return;
    var before = a.join('');
    for (var t = 0; t < 6 && a.join('') === before; t++) {
      for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    }
    state.order = a; save(); renderMarks();
  });

  // My word: five underscores, auto-advance
  var myword = document.getElementById('myword');
  function renderMyWord() {
    myword.innerHTML = '';
    for (var i = 0; i < 5; i++) {
      (function (i) {
        var s = document.createElement('input');
        s.className = 'slot'; s.maxLength = 1; s.value = state.myword[i];
        s.autocapitalize = 'characters'; s.autocomplete = 'off'; s.spellcheck = false;
        s.setAttribute('aria-label', 'My word, letter ' + (i + 1));
        s.addEventListener('input', function () {
          s.value = s.value.replace(/[^a-z]/gi, '').slice(-1).toUpperCase();
          state.myword[i] = s.value; save();
          updateTheirScores();
          if (s.value && s.nextElementSibling) s.nextElementSibling.focus();
        });
        s.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace' && !s.value && s.previousElementSibling) s.previousElementSibling.focus();
        });
        myword.appendChild(s);
      })(i);
    }
  }

  function updateTheirScores() {
    var mine = state.myword.join('');
    document.querySelectorAll('#theirs li').forEach(function (li, idx) {
      var row = state.theirs[idx];
      row.n = common(row.w, mine);
      li.querySelector('.score').textContent = row.n;
      paintTheirs(li, row);
    });
    save();
  }

  function renderList(name) {
    var ol = document.getElementById(name);
    ol.innerHTML = '';
    state[name].forEach(function (row, idx) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="n">' + (idx + 1) + '</span>';
      var cells = document.createElement('div'); cells.className = 'cells';
      var inputs = [];
      var sc;

      function sync() {
        row.w = inputs.map(function (x) { return x.value; }).join('');
        if (name === 'theirs') { row.n = common(row.w, state.myword.join('')); sc.textContent = row.n; paintTheirs(li, row); }
        save();
      }

      for (var i = 0; i < 5; i++) {
        (function (i) {
          var cell = document.createElement('span'); cell.className = 'cell';
          var inp = document.createElement('input');
          inp.maxLength = 5; inp.value = row.w.charAt(i);
          inp.autocapitalize = 'characters'; inp.autocomplete = 'off'; inp.spellcheck = false;
          inp.setAttribute('aria-label', 'Word ' + (idx + 1) + ', letter ' + (i + 1));
          inp.addEventListener('input', function () {
            var typed = inp.value.replace(/[^a-z]/gi, '').toUpperCase();
            if (typed.length > 1 && i < 4) {
              // pasted or fast-typed: spread across the next boxes
              var chars = typed.split('');
              var keep = inp.value.length > 1 && typed.charAt(0) === row.w.charAt(i) ? chars.slice(1) : chars;
              for (var k = 0; k < keep.length && i + k < 5; k++) { inputs[i + k].value = keep[k]; paintCell(inputs[i + k].parentNode); }
              var next = Math.min(i + keep.length, 4);
              sync();
              if (i + keep.length >= 5) { if (name === 'mine') sc.focus(); } else inputs[next].focus();
              return;
            }
            inp.value = typed.slice(-1);
            if (name === 'mine') paintCell(cell);
            sync();
            if (inp.value) { if (i < 4) inputs[i + 1].focus(); else if (name === 'mine') sc.focus(); }
          });
          inp.addEventListener('keydown', function (e) {
            if (e.key === 'Backspace' && !inp.value && i > 0) { inputs[i - 1].focus(); }
          });
          cell.appendChild(inp);
          if (name === 'mine') cell.insertAdjacentHTML('beforeend', strike + ring);
          cells.appendChild(cell);
          inputs.push(inp);
        })(i);
      }

      if (name === 'mine') {
        sc = document.createElement('input');
        sc.className = 'score'; sc.maxLength = 1; sc.inputMode = 'numeric'; sc.value = row.n;
        sc.setAttribute('aria-label', 'Number for word ' + (idx + 1) + ', 0 to 5');
        sc.addEventListener('input', function () {
          sc.value = sc.value.replace(/[^0-5]/g, '').slice(-1);
          row.n = sc.value; save();
        });
      } else {
        sc = document.createElement('output');
        sc.className = 'score auto';
        sc.setAttribute('aria-label', 'Letters in my word for word ' + (idx + 1));
        row.n = common(row.w, state.myword.join(''));
        sc.textContent = row.n;
      }
      li.appendChild(cells); li.appendChild(sc);
      ol.appendChild(li);
      if (name === 'mine') cells.querySelectorAll('.cell').forEach(paintCell);
      else paintTheirs(li, row);
    });
  }

  document.querySelectorAll('[data-add]').forEach(function (b) {
    b.addEventListener('click', function () {
      var name = b.dataset.add;
      state[name].push({ w: '', n: '' }); save(); renderList(name);
      var rows = document.getElementById(name).querySelectorAll('li');
      rows[rows.length - 1].querySelector('input').focus();
    });
  });

  document.getElementById('reset').addEventListener('click', function () {
    state = blank(); save(); renderAll();
    window.scrollTo(0, 0);
  });

  function renderAll() { renderMyWord(); renderList('mine'); renderList('theirs'); renderMarks(); }
  renderAlphabet();
  renderAll();
})();
</script>
</body>
</html>
